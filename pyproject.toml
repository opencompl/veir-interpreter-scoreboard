[project]
name = "veir-interpreter-scoreboard"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py313"

[tool.pyright]
include = ["scripts"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true